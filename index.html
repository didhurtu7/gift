<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لفتة خاصة</title>
    <style>
        body {
            background-color: #f9f5f0;
            font-family: 'Tahoma', sans-serif;
            text-align: center;
            padding: 50px 20px;
            color: #333;
        }
        .card {
            background: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        h1 {
            color: #d4a373;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 30px;
            color: #555;
        }
        .photo-container img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>إلى جميلتي وانيسة روحي ✨</h1>
        <p>
            يقولون كل شخص يحب ياشمس يا قمر وانا في كل الحالات اشوفك شمسي وقمري وكل نجومي , أحبك كثير يا أغلى من سكن روحي وقلبي
        </p>
        
        <!-- مكان الصورة -->
        <div class="photo-container">
            <img src="photo1.jpg" alt="صورة خاصة">
        </div>
    </div>

</body>
</html>
